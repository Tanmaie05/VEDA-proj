<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Number Analyzer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:25px;
}

.card{
    background:#f8f9ff;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
    color:#444;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.range{
    display:flex;
    gap:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#5468d4;
}

.result{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    background:#e8f5e9;
    color:#2e7d32;
    font-weight:600;
}

.prime-list{
    margin-top:15px;
    background:#eef4ff;
    padding:15px;
    border-radius:10px;
    color:#333;
    word-wrap:break-word;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#777;
    font-size:14px;
}

@media(max-width:600px){
    .range{
        flex-direction:column;
    }
}
</style>

</head>
<body>

<div class="container">

    <h1>🔢 Prime Number Analyzer</h1>

    <div class="card">
        <h2>Check Prime Number</h2>

        <form method="POST">
            <input
                type="number"
                name="number"
                placeholder="Enter a number"
                required>

            <button type="submit">
                Check Prime
            </button>
        </form>

        {% if result %}
        <div class="result">
            {{ result }}
        </div>
        {% endif %}
    </div>

    <div class="card">
        <h2>Generate Prime Numbers in Range</h2>

        <form method="POST">

            <div class="range">
                <input
                    type="number"
                    name="start"
                    placeholder="Start"
                    required>

                <input
                    type="number"
                    name="end"
                    placeholder="End"
                    required>
            </div>

            <button type="submit">
                Generate Primes
            </button>

        </form>

        {% if primes %}
        <div class="prime-list">
            <strong>Prime Numbers:</strong><br><br>
            {{ primes|join(', ') }}
        </div>
        {% endif %}
    </div>

    <div class="footer">
        Built with Flask • Task 13
    </div>

</div>

</body>
</html>
