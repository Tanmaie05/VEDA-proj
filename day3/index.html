<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Even or Odd Checker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #ede9fe,
                    #fce7f3
                );

        }


        .container {

            width: 450px;

            padding: 35px;

            background: white;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.15);

            text-align: center;

        }


        .icon {

            font-size: 60px;

            margin-bottom: 10px;

        }


        h1 {

            color: #1e3a8a;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #64748b;

            margin-bottom: 30px;

        }


        label {

            display: block;

            text-align: left;

            font-weight: bold;

            margin-bottom: 8px;

            color: #334155;

        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 12px;

            font-size: 17px;

        }


        input:focus {

            outline: none;

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.15);

        }


        button {

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            transform: translateY(-2px);

        }


        .result {

            margin-top: 25px;

            padding: 20px;

            border-radius: 15px;

            font-size: 20px;

            font-weight: bold;

        }


        .even {

            background: #dcfce7;

            color: #166534;

            border: 1px solid #86efac;

        }


        .odd {

            background: #dbeafe;

            color: #1e40af;

            border: 1px solid #93c5fd;

        }


        .error {

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background: #fee2e2;

            color: #b91c1c;

        }


        .footer {

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="icon">
        🔢
    </div>


    <h1>
        Even & Odd Checker
    </h1>


    <p class="subtitle">
        Enter a number to find out whether it is even or odd.
    </p>


    <form action="/check" method="POST">

        <label>
            Enter a Number
        </label>

        <input
            type="number"
            name="number"
            placeholder="Example: 25"
            value="{{ number if number is defined else '' }}"
            required
        >

        <button type="submit">
            ✨ Check Number
        </button>

    </form>


    {% if result %}

    <div class="result {{ result_type }}">

        {% if result_type == "even" %}
            🟢 {{ result }}
        {% else %}
            🔵 {{ result }}
        {% endif %}

    </div>

    {% endif %}


    {% if error %}

    <div class="error">

        ❌ {{ error }}

    </div>

    {% endif %}


    <div class="footer">

        Python Programming Track • Task 3

    </div>


</div>


</body>

</html>
